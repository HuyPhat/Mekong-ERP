name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Domain-logic coverage (thresholds enforced)
        run: pnpm --filter @mekong-erp/contract test:coverage

      - name: Build
        run: pnpm build

      - name: Initial-load bundle budget
        run: pnpm --filter @mekong-erp/erp budget

      - name: Initial-load bundle budget (Vue inbox)
        run: pnpm --filter @mekong-erp/erp-vue budget

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @mekong-erp/erp exec playwright install --with-deps chromium

      - name: End-to-end + accessibility tests (production build)
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/erp/playwright-report
            apps/erp/test-results
          retention-days: 7

  e2e-vue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Vue inbox end-to-end + accessibility tests (production build, real CSP)
        run: pnpm test:e2e:vue

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-vue
          path: |
            apps/erp-vue/playwright-report
            apps/erp-vue/test-results
          retention-days: 7

  storybook:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build Storybook and check every story (renders, no console errors, axe A/AA)
        run: pnpm test:stories

      - name: Upload the static Storybook
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: packages/ui/storybook-static
          retention-days: 14

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t mekong-erp:ci .

      - name: Smoke test the container and its security headers
        run: |
          docker run -d --rm -p 8080:8080 --name erp mekong-erp:ci
          for i in $(seq 1 20); do curl -fsS -o /dev/null http://localhost:8080/ && break; sleep 1; done
          headers=$(curl -fsSI http://localhost:8080/)
          echo "$headers"
          echo "$headers" | grep -i "content-security-policy: default-src 'self'"
          echo "$headers" | grep -i "x-content-type-options: nosniff"
          curl -fsS -o /dev/null -w '%{http_code}\n' http://localhost:8080/some/deep/link
          docker stop erp
